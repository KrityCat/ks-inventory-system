<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <link href='/luckysheet_dist/plugins/css/pluginsCss.css' rel='stylesheet'/>
    <link href='/luckysheet_dist/plugins/plugins.css' rel='stylesheet'/>
    <link href='/luckysheet_dist/css/luckysheet.css' rel='stylesheet'/>
    <link href='/luckysheet_dist/assets/iconfont/iconfont.css' rel='stylesheet'/>
    <script src="/luckysheet_dist/plugins/js/plugin.js"></script>
    <script src="/luckysheet_dist/luckysheet.umd.js"></script>
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible"/>
    <meta content="webkit" name="renderer"/>
    <meta
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
            name="viewport"
    />
    <link href="/favicon.ico" rel="icon"/>
</head>

<body>
<div id="app">
    <div id="loading">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <p>系统加载中</p>
    </div>
</div>
<script src="/src/main.js" type="module"></script>
</body>

<style lang="scss" scoped>
    #loading {
      text-align: center;
      width: 200px;
      height: 50%;
      margin: 20% auto;
    }
    #loading span {
      height: 80px;
      width: 15px;
      background: #7e81ff;
      display: inline-block;
      animation: loader 1s infinite;
    }
    #loading p {
      color: #7e81ff;
      font-size: 20px;
      font-family: Helvetica;
      text-transform: uppercase;
      margin-top: 5px;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-align: center;
    }
    @keyframes loader {
      50% {
        height: 30px;
        margin-top: 50px;
        opacity: 0.5;
      }
    }
    #loading span:nth-child(1) {
      animation-delay: 0.1s;
    }
    #loading span:nth-child(2) {
      animation-delay: 0.2s;
    }
    #loading span:nth-child(3) {
      animation-delay: 0.3s;
    }
    #loading span:nth-child(4) {
      animation-delay: 0.4s;
    }
    #loading span:nth-child(5) {
      animation-delay: 0.5s;
    }
    #loading span:nth-child(6) {
      animation-delay: 0.6s;
    }
</style>
